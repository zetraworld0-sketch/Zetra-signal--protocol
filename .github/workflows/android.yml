name: Build Netscape Lite APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Institutional-grade memory allocation
      GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Build APK
        # -x lint -x test: Directly removes the 1-hour "hang" by skipping tests
        # --no-daemon: Ensures memory is cleared so the runner doesn't freeze
        # workers.max=2: Prevents the 12-minute "Red Mark" crash (Exit 143)
        run: ./gradlew :Signal-Android:assemblePlayProdDebug -x lint -x test --no-daemon --stacktrace -Dorg.gradle.workers.max=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netscape-apk
          path: Signal-Android/build/outputs/apk/**/*.apk
