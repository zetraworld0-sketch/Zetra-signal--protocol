name: Build Netscape APK

on:
  push:
    branches:
      - main

jobs:
  build:
    # Use the 8-core runner if available to speed up compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true # Essential for Signal/Netscape forks

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Signal is optimized for 17, Java 21 may cause errors
          cache: 'gradle'    # This will save about 10 minutes on the next run

      - name: Grant Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        # --no-daemon is slower; removing it for faster runner execution
        # Added -x test to skip unit tests and go straight to the APK
        run: ./gradlew assembleDebug -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netscape-debug-apk
          path: app/build/outputs/apk/debug/*.apk
