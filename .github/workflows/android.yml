name: Build Netscape Lite APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Memory allocation for the JVM and Kotlin daemon
      GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true # Essential if your fork relies on Signal's sub-libraries

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle' # This will speed up future runs significantly

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Build APK
        # -x lint -x test: Skips hours of background checks to stop the 1-hour hang
        # --no-daemon: Prevents memory leaks that cause the "stuck" state
        # workers.max=2: Prevents the Exit 143 (Red Mark) memory crash
        run: ./gradlew :Signal-Android:assemblePlayProdDebug -x lint -x test --no-daemon --stacktrace -Dorg.gradle.workers.max=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netscape-apk
          path: Signal-Android/build/outputs/apk/**/*.apk
